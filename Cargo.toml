[workspace]
resolver = "3"
members = ["client", "common", "server"]

# configuration that is shared among dependencies
[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Mehmet Emre"]
description = "CS 272 Milestone 2 Template"

# common dependencies
[workspace.dependencies]
bevy = { version = "0.18.0", default-features = false, features = ["bevy_color", "serialize"] }
rand = "0.9.2"
getrandom = "0.4.2"
lightyear = { version = "0.26.4", features = ["websocket", "raw_connection", "replication"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
